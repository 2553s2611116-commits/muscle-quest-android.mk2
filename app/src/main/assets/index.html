<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d0e"><title>MUSCLE QUEST</title><style>
:root{--bg:#090d0e;--panel:#12191b;--line:#263336;--text:#eef5f2;--muted:#9eadaa;--lime:#c1ff75;--red:#ff4c5d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}header{padding:22px 17px 15px;background:linear-gradient(135deg,#17211b,#0a0e10);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}header small{color:var(--lime);font-weight:800;letter-spacing:2px}h1{font-size:25px;margin:4px 0}header p{color:var(--muted);margin:0;font-size:12px}.tabs{display:flex;gap:7px;padding:10px;overflow:auto;background:#0b1011;position:sticky;top:94px;z-index:4}.tabs button{white-space:nowrap;flex:1}.btn,button{background:#1a2526;color:var(--text);border:1px solid #314142;border-radius:11px;padding:10px 12px;font-weight:650;font-size:13px}.btn.active,.primary{background:var(--lime);color:#11170b;border-color:var(--lime)}main{padding:12px 12px 38px;max-width:900px;margin:auto}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#172021;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px;color:var(--lime)}input,select,textarea{width:100%;background:#0a1011;color:var(--text);border:1px solid #344244;border-radius:10px;padding:11px;margin:4px 0 9px;font:inherit}label{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.excard{background:#121a1b;border:1px solid #2a3738;border-radius:14px;padding:12px;min-width:0}.excard h3{font-size:15px;margin:6px 0}.pill{display:inline-block;background:#233027;color:var(--lime);border-radius:20px;padding:4px 7px;margin:2px;font-size:11px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}h2{font-size:19px;margin:8px 0 12px}h3{margin:4px 0 8px}.back{color:var(--lime);background:none;border:0;padding:0 0 12px}.illustration{background:#0b1112;border-radius:13px;padding:8px;text-align:center}.illustration svg{width:100%;max-height:230px}.muscles{display:grid;grid-template-columns:1fr 1fr;gap:7px}.musclebox{background:#0d1415;border:1px solid #2b3839;border-radius:12px;padding:10px}.red{color:#ff7782}.checkrow{display:flex;gap:8px;align-items:center}.checkrow input{width:auto}.tip{border-left:3px solid var(--lime);padding:9px 12px;background:#17201b;border-radius:0 10px 10px 0;margin:8px 0}.empty{color:var(--muted);padding:22px;text-align:center}.footer{color:#71807b;text-align:center;font-size:11px;padding:12px}@media(min-width:650px){main{padding:20px}.tabs{top:94px}}
</style></head><body><header><small>MUSCLE QUEST / OFFLINE</small><h1>운동을 이해하고, 기록하다.</h1><p>로그인 없이 · 데이터는 이 기기에 저장됩니다</p></header><nav class="tabs"><button class="btn active" data-tab="home">홈</button><button class="btn" data-tab="library">운동 도감</button><button class="btn" data-tab="routines">루틴</button><button class="btn" data-tab="analysis">근육 분석</button><button class="btn" data-tab="tips">근육학 TIP</button><button class="btn" data-tab="backup">백업</button></nav><main id="app"></main><div class="footer">MUSCLE QUEST · 오프라인 개인용 앱</div><script>
let DB={exercises:[],tips:[]},data={saved:[],routines:[],history:[]},tab='home',selected=null,filter={q:'',body:'전체',level:'전체',type:'전체',goal:'전체'},routineDraft=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem('mq_data_v1',JSON.stringify(data))}function load(){try{data={...data,...JSON.parse(localStorage.getItem('mq_data_v1')||'{}')}}catch(e){}}function allGoals(){return [...new Set(DB.exercises.flatMap(e=>e.goals||[]))].sort()}function tags(e){return `<span class="pill">${esc(e.level)}</span><span class="pill">${esc(e.body)}</span><span class="pill">${esc(e.type)}</span>`+(e.goals||[]).slice(0,2).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}function exCard(e){return `<article class="excard"><div class="muted">${esc(e.body)} · ${esc(e.level)}</div><h3>${esc(e.name)}</h3><div>${tags(e)}</div><p class="muted">주요 근육: ${esc((e.main||[]).join(', '))}</p><button onclick="openExercise(${DB.exercises.indexOf(e)})" class="primary">자세히 보기</button><button onclick="toggleSave(${DB.exercises.indexOf(e)})">${data.saved.includes(e.name)?'★ 저장됨':'☆ 저장'}</button></article>`}function muscleSvg(e){let areas=[['가슴','대흉근'],['등','광배근'],['어깨','삼각근'],['팔','이두근'],['팔','삼두근'],['하체','대퇴사두근'],['하체','둔근'],['하체','햄스트링'],['코어','복직근'],['코어','복사근']];let main=(e.main||[]).concat(e.sub||[]).join(' ');let hit=areas.map(([b,m])=>main.includes(m)||e.body===b);return `<svg viewBox="0 0 320 190" role="img" aria-label="운동 근육 개념도"><g fill="#344245" stroke="#73817e" stroke-width="1.5"><circle cx="160" cy="25" r="13"/><path d="M147 42 Q130 45 126 62 L116 91 Q114 99 122 101 L136 76 L139 115 L130 165 Q129 174 139 174 L151 124 L169 124 L181 174 Q191 176 190 165 L181 115 L184 76 L198 101 Q207 98 203 91 L194 62 Q190 45 173 42 Z"/><path d="M147 44 L132 48 L113 91 L121 95 L143 63 M173 44 L188 48 L207 91 L199 95 L177 63" fill="#2b383b"/><path d="M139 115 L151 124 L145 166 L137 166 M181 115 L169 124 L175 166 L183 166" fill="#2b383b"/></g>${hit.map((v,i)=>v?`<ellipse cx="${[151,174,140,132,187,145,160,175,160,150][i]}" cy="${[63,68,49,80,81,139,115,143,86,89][i]}" rx="${[12,10,8,5,5,8,12,7,8,6][i]}" ry="${[8,13,7,9,9,19,8,18,13,8][i]}" fill="#ff4c5d" opacity=".9"/>`:'' ).join('')}<text x="12" y="184" fill="#a4b0ac" font-size="9">운동 부위 기반 개념도 · 실제 활성도/해부학적 위치와 다를 수 있음</text></svg>`}function openExercise(i){selected=i;renderDetail()}function renderDetail(){let e=DB.exercises[selected];$('#app').innerHTML=`<button class="back" onclick="render('library')">← 도감으로</button><div class="panel"><h2>${esc(e.name)}</h2><div>${tags(e)}</div><div class="illustration"><svg viewBox="0 0 320 150"><g stroke="#d4e2dc" stroke-width="5" stroke-linecap="round" fill="none"><circle cx="160" cy="22" r="12"/><path d="M160 36 L160 78 M160 47 L130 64 L116 50 M160 47 L190 64 L204 50 M160 78 L140 116 L128 143 M160 78 L180 116 L192 143"/></g><path d="M135 45 Q160 34 185 45 L180 70 Q160 80 140 70Z" fill="#ff4c5d" opacity=".8"/><text x="160" y="14" text-anchor="middle" fill="#a4b0ac" font-size="8">운동 동작 개념도</text></svg></div><h3>사용 근육 지도</h3><div class="illustration">${muscleSvg(e)}</div><div class="muscles"><div class="musclebox"><label>주요 근육</label><p class="red">${esc((e.main||[]).join(', '))}</p></div><div class="musclebox"><label>보조 근육</label><p>${esc((e.sub||[]).join(', ')||'별도 표기 없음')}</p></div></div><h3>수행 방법</h3><p>${esc(e.form)}</p><h3>근육학 TIP</h3><div class="tip">${esc(e.tip)}</div><p><label>장비</label><br>${esc(e.equipment||'없음')}</p><p><label>관련 운동</label><br>${esc((e.related||[]).join(' · ')||'관련 운동 없음')}</p><button class="primary" onclick="toggleSave(${selected});renderDetail()">${data.saved.includes(e.name)?'★ 저장 해제':'☆ 운동 저장'}</button><button onclick="addToDraft(${selected})">루틴에 추가</button></div>`}function render(view=tab){tab=view;selected=null;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===view));let a=$('#app');if(view==='home'){a.innerHTML=`<div class="panel"><h2>오늘도 한 단계씩.</h2><p class="muted">네 운동 자료와 기록은 이 기기 안에 저장돼.</p><div class="stats"><div class="stat"><b>${DB.exercises.length}</b><span class="muted">운동</span></div><div class="stat"><b>${data.saved.length}</b><span class="muted">저장</span></div><div class="stat"><b>${data.routines.length}</b><span class="muted">루틴</span></div></div></div><div class="grid"><div class="card"><h3>운동 도감</h3><p class="muted">태그로 운동 찾기</p><button class="primary" onclick="render('library')">도감 열기</button></div><div class="card"><h3>루틴</h3><p class="muted">나만의 운동 계획</p><button class="primary" onclick="render('routines')">루틴 관리</button></div><div class="card"><h3>근육 분석</h3><p class="muted">선택한 운동의 주요 근육</p><button class="primary" onclick="render('analysis')">분석하기</button></div><div class="card"><h3>근육학 TIP</h3><p class="muted">짧게 배우는 근육 지식</p><button class="primary" onclick="render('tips')">TIP 읽기</button></div></div><div class="panel"><h2>저장한 운동</h2>${data.saved.length?`<div class="grid">${DB.exercises.filter(e=>data.saved.includes(e.name)).slice(0,4).map(exCard).join('')}</div>`:'<div class="empty">도감에서 ☆ 저장을 눌러 운동을 모아 봐.</div>'}</div>`}else if(view==='library'){a.innerHTML=`<h2>운동 도감 <span class="muted">${DB.exercises.length}개</span></h2><div class="panel"><label>이름·근육·장비 검색</label><input id="q" placeholder="예: 가슴, 맨몸, 폭발력" value="${esc(filter.q)}" oninput="filter.q=this.value;renderLibraryList()"><div class="row"><div><label>부위</label><select id="body" onchange="filter.body=this.value;renderLibraryList()">${['전체',...new Set(DB.exercises.map(e=>e.body))].map(x=>`<option ${filter.body===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>난이도</label><select onchange="filter.level=this.value;renderLibraryList()">${['전체','초급','중급','상급'].map(x=>`<option ${filter.level===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="row"><div><label>운동 방식</label><select onchange="filter.type=this.value;renderLibraryList()">${['전체',...new Set(DB.exercises.map(e=>e.type))].map(x=>`<option ${filter.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>목적 태그</label><select onchange="filter.goal=this.value;renderLibraryList()">${['전체',...allGoals()].map(x=>`<option ${filter.goal===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><p class="muted">필터를 조합해 원하는 운동을 찾아봐.</p></div><div id="exlist"></div>`;renderLibraryList()}else if(view==='routines'){a.innerHTML=`<h2>내 루틴</h2><div class="panel"><label>새 루틴 이름</label><input id="rname" placeholder="예: 월요일 전신"><label>운동 추가</label><input id="rq" placeholder="운동 이름 검색" oninput="showRoutinePicker(this.value)"><div id="picker"></div><p class="muted">선택한 운동: ${routineDraft.length}개</p><button class="primary" onclick="saveRoutine()">루틴 저장</button><button onclick="routineDraft=[];render('routines')">선택 초기화</button></div><div id="routineslist">${data.routines.length?data.routines.map((r,i)=>`<div class="panel"><h3>${esc(r.name)}</h3><p>${r.items.map(esc).join(' · ')}</p><button onclick="startRoutine(${i})">운동 보기</button><button onclick="deleteRoutine(${i})">삭제</button></div>`).join(''):'<div class="empty">아직 루틴이 없어. 위에서 만들어 봐.</div>'}</div>`}else if(view==='analysis'){a.innerHTML=`<h2>근육 분석</h2><div class="panel"><p class="muted">분석할 운동을 선택하면 주요 근육의 등장 횟수를 집계해.</p><label>운동 이름 검색</label><input id="aq" placeholder="운동 검색" oninput="renderAnalysisList(this.value)"><div id="alist"></div><button class="primary" onclick="analyze()">선택한 운동 분석</button><div id="analysisresult"></div></div>`;renderAnalysisList('')}else if(view==='tips'){a.innerHTML=`<h2>근육학 TIP</h2>${DB.tips.map(t=>`<div class="panel"><span class="pill">${esc(t.category)}</span><h3>${esc(t.title)}</h3><p>${esc(t.body)}</p><div class="tip">${esc(t.fact)}</div></div>`).join('')}`}else if(view==='backup'){a.innerHTML=`<h2>백업 · 복원</h2><div class="panel"><p>운동 저장 목록과 루틴을 JSON 텍스트로 백업할 수 있어. 텍스트를 복사해 안전한 곳에 보관해.</p><button class="primary" onclick="exportBackup()">백업 데이터 만들기</button><textarea id="backuptext" rows="7" placeholder="백업 텍스트가 여기에 표시됩니다. 복원할 JSON을 붙여넣어도 됩니다."></textarea><button class="primary" onclick="importBackup()">이 텍스트로 복원</button><p class="muted">복원하면 현재 저장 목록과 루틴이 백업 내용으로 바뀝니다.</p></div>`}}
function renderLibraryList(){let q=(filter.q||'').toLowerCase();let found=DB.exercises.filter(e=>(filter.body==='전체'||e.body===filter.body)&&(filter.level==='전체'||e.level===filter.level)&&(filter.type==='전체'||e.type===filter.type)&&(filter.goal==='전체'||(e.goals||[]).includes(filter.goal))&&[e.name,e.body,e.type,e.level,e.equipment,...e.main,...e.sub,...e.goals].join(' ').toLowerCase().includes(q));$('#exlist').innerHTML=`<p class="muted">${found.length}개 운동</p><div class="grid">${found.map(exCard).join('')}</div>`}function toggleSave(i){let n=DB.exercises[i].name;data.saved.includes(n)?data.saved=data.saved.filter(x=>x!==n):data.saved.push(n);persist();if(tab==='library'&&$('#exlist'))renderLibraryList();if(tab==='home'&&selected===null)render('home')}function addToDraft(i){let n=DB.exercises[i].name;if(!routineDraft.includes(n))routineDraft.push(n);alert(n+' 루틴에 추가됨. 루틴 화면에서 저장해.')}function showRoutinePicker(q){let f=DB.exercises.filter(e=>e.name.toLowerCase().includes((q||'').toLowerCase())).slice(0,8);$('#picker').innerHTML=f.map(e=>`<div class="checkrow"><input type="checkbox" ${routineDraft.includes(e.name)?'checked':''} onchange="${routineDraft.includes(e.name)?`routineDraft=routineDraft.filter(x=>x!==${JSON.stringify(e.name)})`:`routineDraft.push(${JSON.stringify(e.name)})`};render('routines')}"><span>${esc(e.name)}</span></div>`).join('')}function saveRoutine(){let name=$('#rname').value.trim();if(!name||!routineDraft.length){alert('루틴 이름과 운동을 입력해 줘.');return}data.routines.push({name,items:[...routineDraft]});routineDraft=[];persist();render('routines')}function deleteRoutine(i){data.routines.splice(i,1);persist();render('routines')}function startRoutine(i){let r=data.routines[i];$('#app').innerHTML=`<button class="back" onclick="render('routines')">← 루틴으로</button><div class="panel"><h2>${esc(r.name)}</h2>${r.items.map(n=>{let e=DB.exercises.find(x=>x.name===n);return e?`<div class="card"><h3>${esc(e.name)}</h3><p class="muted">${esc(e.form)}</p><button onclick="openExercise(${DB.exercises.indexOf(e)})">운동 보기</button><label class="checkrow"><input type="checkbox" onchange="if(this.checked){data.history.push({name:${JSON.stringify(e.name)},date:new Date().toISOString().slice(0,10)});persist()}"> 오늘 완료</label></div>`:''}).join('')}</div>`}function renderAnalysisList(q){let f=DB.exercises.filter(e=>e.name.toLowerCase().includes((q||'').toLowerCase())).slice(0,30);$('#alist').innerHTML=f.map(e=>`<label class="checkrow"><input type="checkbox" class="anex" value="${esc(e.name)}">${esc(e.name)} <span class="muted">${esc(e.body)}</span></label>`).join('')}function analyze(){let names=[...document.querySelectorAll('.anex:checked')].map(x=>x.value);let counts={};DB.exercises.filter(e=>names.includes(e.name)).forEach(e=>[...e.main,...e.sub].forEach(m=>counts[m]=(counts[m]||0)+1));let sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);$('#analysisresult').innerHTML=names.length?`<h3>선택한 ${names.length}개 운동의 근육 구성</h3>${sorted.map(([m,n])=>`<div class="panel"><div class="row"><span>${esc(m)}</span><b>${n}회</b></div><div style="height:6px;background:#273334;border-radius:5px"><div style="height:6px;background:var(--lime);border-radius:5px;width:${100*n/(sorted[0][1]||1)}%"></div></div></div>`).join('')}`:'<p class="muted">분석할 운동을 하나 이상 선택해.</p>'}function exportBackup(){$('#backuptext').value=JSON.stringify({version:1,saved:data.saved,routines:data.routines,history:data.history},null,2);$('#backuptext').focus();$('#backuptext').select()}function importBackup(){try{let x=JSON.parse($('#backuptext').value);if(!Array.isArray(x.saved)||!Array.isArray(x.routines))throw Error();data={saved:x.saved,routines:x.routines,history:x.history||[]};persist();alert('복원 완료');render('backup')}catch(e){alert('백업 JSON 형식이 올바르지 않아.')}}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.tab)));fetch('data.json').then(r=>r.json()).then(d=>{DB=d;load();render('home')}).catch(()=>{$('#app').innerHTML='<div class="panel">운동 데이터를 불러오지 못했어. 앱을 다시 설치해 봐.</div>'});
</script></body></html>
